<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Jett Home</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jett Home">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="/app.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: a dark, photographic remote. The TV's current photo, blurred, sits behind everything;
   glass cards float on it; a floating tab bar switches between Now, Mornings, Bar, Backdrops, Home. */
@font-face { font-family: "Cormorant"; src: url("fonts/serif.ttf") format("truetype"); font-weight: 300 700; font-display: swap; }
@font-face { font-family: "Cormorant Italic"; src: url("fonts/italic.ttf") format("truetype"); font-weight: 300 700; font-style: italic; font-display: swap; }
:root {
  --bg: #0b0d12;
  --ink: #f3f1ec;
  --ink-2: rgba(243,241,236,.66);
  --ink-3: rgba(243,241,236,.42);
  --glass: rgba(20,23,30,.58);
  --glass-2: rgba(255,255,255,.06);
  --line: rgba(255,255,255,.09);
  --gold: #e8c27a;
  --gold-deep: #b8914d;
  --live: #ff6b5e;
  --ok: #8fd9b0;
  --serif: "Cormorant", "Iowan Old Style", "Palatino", Georgia, serif;
  --italic: "Cormorant Italic", "Cormorant", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --r: 22px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--sans); font-variant-numeric: lining-nums; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Backdrop: the TV's photo, blurred and darkened */
#sky { position: fixed; inset: -40px; z-index: 0; background: #0b0d12 center/cover no-repeat; filter: blur(34px) saturate(1.15); transform: scale(1.08); transition: background-image .8s; }
#sky::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,10,14,.55), rgba(8,10,14,.78) 45%, rgba(8,10,14,.92)); }

.app { position: relative; z-index: 1; min-height: 100%; padding: calc(env(safe-area-inset-top) + 14px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 108px) max(16px, env(safe-area-inset-left)); max-width: 560px; margin: 0 auto; }

/* Type */
.eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.display { font-family: var(--serif); font-weight: 500; font-size: 38px; line-height: 1.02; letter-spacing: .005em; margin: 4px 0 0; text-wrap: balance; }
.display em { font-family: var(--italic); font-style: italic; font-weight: 500; color: var(--gold); }
h2.sec { font-family: var(--serif); font-weight: 500; font-size: 25px; margin: 28px 4px 10px; letter-spacing: .005em; }
h2.sec small { font-family: var(--sans); font-size: 13px; color: var(--ink-3); font-weight: 400; margin-left: 8px; letter-spacing: 0; }
.muted { color: var(--ink-2); }
.tiny { font-size: 12.5px; color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* Glass card */
.card { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3); padding: 16px; }
.card + .card { margin-top: 12px; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.list > .item { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-top: 1px solid var(--line); min-height: 52px; }
.list > .item:first-child { border-top: 0; padding-top: 2px; }
.list > .item:last-child { padding-bottom: 2px; }
.item .label { flex: 1; min-width: 0; }
.item .label b { display: block; font-weight: 500; }
.item .label span { display: block; font-size: 13px; color: var(--ink-3); margin-top: 1px; }

/* Header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 6px 4px 0; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 7px 11px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.status.on .dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.status.off .dot { background: var(--ink-3); }
.status.lost .dot { background: var(--live); }

/* Hero: what's on the TV */
.hero { position: relative; margin-top: 16px; border-radius: 26px; overflow: hidden; aspect-ratio: 16/9; max-width: 100%; background: #14171d center/cover no-repeat; border: 1px solid var(--line); box-shadow: 0 30px 60px -30px rgba(0,0,0,.8); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.0) 40%, rgba(0,0,0,.55)); }
.hero .cap { position: absolute; right: 16px; left: 16px; bottom: 12px; z-index: 1; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--italic); font-style: italic; font-size: 21px; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.hero .tag { position: absolute; left: 14px; top: 14px; z-index: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(0,0,0,.45); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.12); }
.hero.asleep { display: grid; place-items: center; }
.hero.asleep .zz { font-family: var(--italic); font-style: italic; font-size: 26px; color: var(--ink-2); z-index: 1; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 14px; background: var(--glass-2); border: 1px solid var(--line); font-weight: 600; font-size: 14.5px; transition: transform .12s, background .2s; }
.btn:active { transform: scale(.97); }
.btn.gold { background: linear-gradient(180deg, #f0d293, var(--gold)); color: #1a1408; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--live); }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

/* Big round action buttons */
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
.act { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 14px 4px 12px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); font-size: 12px; font-weight: 500; color: var(--ink-2); transition: transform .12s; }
.act:active { transform: scale(.95); }
.act svg { width: 24px; height: 24px; color: var(--ink); }
.act.lit svg { color: var(--gold); }

/* Volume */
.vol { display: flex; align-items: center; gap: 14px; }
.vol .n { font-family: var(--sans); font-size: 34px; font-weight: 300; width: 58px; text-align: center; line-height: 1; }
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-2); border: 1px solid var(--line); flex: none; }
.round svg { width: 18px; height: 18px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--gold) var(--p, 30%), rgba(255,255,255,.12) var(--p, 30%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: #fbf8f1; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--gold); }
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: #fbf8f1; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--line); font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .2s, border-color .2s, color .2s; }
.chip.on { background: rgba(232,194,122,.16); border-color: rgba(232,194,122,.55); color: #f6dfb0; }
.chip .x { opacity: .55; font-size: 16px; line-height: 1; }
.chip.add { color: var(--gold); border-style: dashed; }

/* Channel tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { position: relative; width: 100%; padding: 14px 12px; min-height: 76px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); text-align: left; display: flex; flex-direction: column; justify-content: space-between; transition: transform .12s; }
.tile:active { transform: scale(.96); }
.tile b { font-size: 16px; font-weight: 650; letter-spacing: .01em; }
.tile span { font-size: 11px; color: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; }
.tile.app b { font-size: 14px; }

/* Sound cards (nature videos) */
.sounds { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 4px; scroll-snap-type: x mandatory; }
.sounds::-webkit-scrollbar { display: none; }
.sound { flex: none; width: 156px; scroll-snap-align: start; border-radius: 18px; overflow: hidden; background: var(--glass); border: 1px solid var(--line); text-align: left; }
.sound .art { height: 88px; background: #222 center/cover; position: relative; }
.sound .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.45)); }
.sound .t { padding: 10px 12px 12px; }
.sound .t b { display: block; font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.05; }
.sound .t span { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 4px; line-height: 1.3; }
.sound.on { border-color: rgba(232,194,122,.65); box-shadow: 0 0 0 1px rgba(232,194,122,.4) inset; }

/* Remote */
.pad { position: relative; width: 210px; height: 210px; margin: 6px auto 4px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.09), rgba(255,255,255,.03)); border: 1px solid var(--line); }
.pad button { position: absolute; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; }
.pad button:active { background: rgba(255,255,255,.08); }
.pad .u { left: 73px; top: 4px; } .pad .d { left: 73px; bottom: 4px; } .pad .l { left: 4px; top: 73px; } .pad .r { right: 4px; top: 73px; }
.pad .ok { left: 55px; top: 55px; width: 100px; height: 100px; background: rgba(255,255,255,.07); border: 1px solid var(--line); font-weight: 650; letter-spacing: .1em; font-size: 13px; }
.pad svg { width: 22px; height: 22px; }

/* Switch */
.sw { position: relative; width: 51px; height: 31px; flex: none; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.16); transition: background .2s; }
.sw span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fbf8f1; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .22s cubic-bezier(.3,.7,.4,1.2); }
.sw input:checked + span { background: var(--gold); }
.sw input:checked + span::after { transform: translateX(20px); }
.sw input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Segmented */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 13px; background: rgba(255,255,255,.07); border: 1px solid var(--line); }
.seg button { min-height: 36px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: rgba(255,255,255,.14); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.3); }

/* Fields */
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 50px; }
.field + .field { border-top: 1px solid var(--line); }
input[type=time], select, input[type=text], .code input { background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; min-height: 40px; }
input[type=time] { font-variant-numeric: tabular-nums; min-width: 112px; text-align: center; }
select { max-width: 60%; -webkit-appearance: none; appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
input[type=text] { width: 100%; }

/* Week list */
.day { display: flex; align-items: center; gap: 14px; padding: 12px 2px; border-top: 1px solid var(--line); text-align: left; width: 100%; }
.day:first-child { border-top: 0; padding-top: 2px; }
.day .dn { width: 42px; font-family: var(--serif); font-size: 21px; font-weight: 600; }
.day .dt { flex: 1; min-width: 0; }
.day .dt b { display: block; font-family: var(--sans); font-size: 22px; font-weight: 300; letter-spacing: -.01em; line-height: 1.1; }
.day .dt span { display: block; font-size: 12.5px; color: var(--ink-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.day.off .dt b, .day.off .dn { color: var(--ink-3); }

/* Next-up card */
.next { position: relative; overflow: hidden; }
.next .when { font-family: var(--sans); font-size: 50px; font-weight: 200; letter-spacing: -.02em; line-height: 1; margin-top: 8px; }
.next .when small { font-size: 20px; font-weight: 400; margin-left: 6px; color: var(--ink-2); letter-spacing: 0; }
.timeline { margin-top: 14px; display: grid; gap: 10px; }
.tl { display: flex; gap: 12px; align-items: flex-start; }
.tl i { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--gold); box-shadow: 0 0 0 4px rgba(232,194,122,.15); }
.tl.s i { background: #9cc4ff; box-shadow: 0 0 0 4px rgba(156,196,255,.15); }
.tl.o i { background: var(--ink-3); box-shadow: 0 0 0 4px rgba(255,255,255,.06); }
.tl b { font-weight: 600; } .tl span { color: var(--ink-2); }

/* Photo gallery */
.gal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-radius: 16px; overflow: hidden; }
.ph { position: relative; aspect-ratio: 1; background: #15181e center/cover; }
.ph.hid { opacity: .28; }
.ph .hrt { position: absolute; top: 5px; right: 6px; font-size: 13px; color: var(--gold); text-shadow: 0 1px 4px #000; }
.ph .eye { position: absolute; top: 5px; left: 6px; font-size: 10px; font-weight: 700; letter-spacing: .08em; background: rgba(0,0,0,.6); padding: 2px 5px; border-radius: 5px; }

/* Tab bar */
nav.tabs { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 12px); width: min(calc(100% - 24px), 520px); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; border-radius: 26px; background: rgba(18,20,26,.72); border: 1px solid var(--line); -webkit-backdrop-filter: blur(26px) saturate(1.4); backdrop-filter: blur(26px) saturate(1.4); box-shadow: 0 18px 40px -12px rgba(0,0,0,.8); }
nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; border-radius: 20px; font-size: 10.5px; font-weight: 600; color: var(--ink-3); letter-spacing: .02em; }
nav.tabs button svg { width: 23px; height: 23px; }
nav.tabs button.on { color: var(--ink); background: rgba(255,255,255,.08); }
nav.tabs button.on svg { color: var(--gold); }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.5); opacity: 0; transition: opacity .25s; }
.scrim.show { opacity: 1; }
.sheet { position: fixed; z-index: 11; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; margin: 0 auto; max-width: 560px; background: #15181f; border: 1px solid var(--line); border-bottom: 0; border-radius: 26px 26px 0 0; padding: 10px max(18px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 22px) max(18px, env(safe-area-inset-left)); transform: translateY(102%); transition: transform .32s cubic-bezier(.2,.8,.2,1); overscroll-behavior: contain; }
.sheet.show { transform: none; }
.sheet .grab { width: 38px; height: 5px; border-radius: 5px; background: rgba(255,255,255,.2); margin: 0 auto 12px; }
.sheet h3 { font-family: var(--serif); font-size: 30px; font-weight: 500; margin: 2px 0 14px; }
.sheet h3 em { font-family: var(--italic); font-style: italic; color: var(--gold); }
.sheet .sub { margin: -10px 0 16px; color: var(--ink-3); font-size: 13.5px; }
.sheet .card { background: rgba(255,255,255,.04); -webkit-backdrop-filter: none; backdrop-filter: none; }
.sheet .bigph { border-radius: 18px; aspect-ratio: 16/10; max-width: 100%; background: #222 center/cover; }

/* Toast */
.toast { position: fixed; z-index: 20; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translate(-50%, -140%); background: rgba(24,27,34,.92); border: 1px solid var(--line); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 500; transition: transform .35s cubic-bezier(.2,.8,.2,1); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.toast.show { transform: translate(-50%, 0); }
.toast.err { color: #ffb4ad; }

/* Pairing */
.pair { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 8px 60px; }
.pair .mark { font-family: var(--serif); font-size: 60px; font-weight: 500; line-height: .95; }
.pair .mark em { font-family: var(--italic); font-style: italic; color: var(--gold); }
.code { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 24px 0 18px; }
.code input { text-align: center; font-family: var(--sans); font-size: 36px; font-weight: 300; height: 76px; border-radius: 16px; padding: 0; }

.bignum { font-family: var(--sans); font-weight: 300; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.xbtn { position: absolute; top: 12px; right: 14px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); color: var(--ink-2); font-size: 17px; }
.sheet { position: fixed; }
/* Live bar strip */
.live { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 4px; }
.live::-webkit-scrollbar { display: none; }
.gc { flex: none; width: 196px; padding: 12px 14px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); text-align: left; }
.gc .h { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.gc .h .lv { color: var(--live); }
.gc .tm { display: flex; align-items: center; gap: 9px; margin-top: 8px; font-weight: 600; font-size: 16px; }
.gc .tm img { width: 24px; height: 24px; object-fit: contain; }
.gc .tm .sc { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 500; }
.gc .ft { margin-top: 8px; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gc.show b { display: block; font-size: 22px; font-weight: 700; margin-top: 8px; }
.gc.pin { border-color: rgba(232,194,122,.45); }
.tile .lg { width: 100%; height: 44px; object-fit: contain; object-position: left center; }
.tile.app { min-height: 84px; padding: 12px; }
.tile.app img.banner { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
.tile.app.hasimg b { position: absolute; left: -9999px; }
.tile .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); display: inline-block; margin-right: 6px; vertical-align: 1px; }
.team img { width: 20px; height: 20px; object-fit: contain; margin-left: -4px; }
.chrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.chrow:first-child { border-top: 0; }
.chrow .round { width: 34px; height: 34px; }
.fade-in { animation: fi .4s ease both; }
.stale { opacity: .42; pointer-events: none; filter: saturate(.4); transition: opacity .3s; }
.asleepnote { display: flex; flex-direction: column; gap: 4px; border-color: rgba(232,194,122,.28); }
.asleepnote b { font-family: "Cormorant", serif; font-size: 21px; font-weight: 500; }
.asleepnote span { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.status.wait .dot { background: var(--ink-3); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
a.btn { text-decoration: none; display: flex; align-items: center; justify-content: center; }
@keyframes fi { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.spacer { height: 8px; }
.center { text-align: center; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
</style>
</head>
<body>
<div id="sky"></div>
<main class="app" id="app"></main>
<nav class="tabs" id="tabs" hidden></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ------------------------------------------------------------ basics */
const $ = (s, el = document) => el.querySelector(s);
const ICON = {
  now: '<path d="M4 6.5h16v10H4z"/><path d="M9 20h6M12 16.5V20"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  bar: '<rect x="3" y="7" width="7.5" height="10" rx="2"/><rect x="13.5" y="7" width="7.5" height="10" rx="2"/>',
  photo: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/>',
  home: '<path d="M4 11.5 12 5l8 6.5V20h-5.5v-5h-5v5H4z"/>',
  power: '<path d="M12 3.5v8"/><path d="M7.2 6.8a7 7 0 1 0 9.6 0"/>',
  moon: '<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>',
  minus: '<path d="M6 12h12"/>', plus: '<path d="M12 6v12M6 12h12"/>',
  mute: '<path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="m16 9.5 4.5 5M20.5 9.5 16 14.5"/>',
  up: '<path d="m6 15 6-6 6 6"/>', down: '<path d="m6 9 6 6 6-6"/>', left: '<path d="m15 6-6 6 6 6"/>', right: '<path d="m9 6 6 6-6 6"/>',
  back: '<path d="M9 7 4 12l5 5"/><path d="M4.5 12H14a6 6 0 0 1 0 12"/>',
  play: '<path d="M8 5.5v13l10-6.5z"/>', heart: '<path d="M12 19.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 6.8a4.3 4.3 0 0 1 7.5 2.7c0 5.4-7.5 10-7.5 10z"/>',
  eyeoff: '<path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 8.5 4.5 9.5 6a15 15 0 0 1-2.8 3.3M6.3 7.6A15 15 0 0 0 2.5 12c1 1.5 4.5 6 9.5 6a9.6 9.6 0 0 0 4-.9"/>',
  remote: '<rect x="7" y="2.5" width="10" height="19" rx="5"/><circle cx="12" cy="8" r="2"/><path d="M12 14v.01M12 17v.01"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
};
const ic = (k, sw = 1.6) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k] || ""}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let token = store.get("jett.token") || "";
let S = null;          // settings
let ST = null;         // status
let CAT = null;        // catalog
let tab = store.get("jett.tab") || "now";
let tvVolume = null, tvMuted = false;
let STALE = false;     // away and the box hasn't answered: showing the last known state
let UPDATING = false;  // away, opened on the saved state, asking the box for fresh news
let stAt = Date.now(); // when ST arrived (the clock runs on from its time)
/* Away, the app opens on the last state it saw (the box may be asleep). */
function cacheSave() { if (RELAY) try { store.set("jett.cache", JSON.stringify({ S, ST, CAT: CAT && { ...CAT, photos: [] }, at: stAt })); } catch (e) {} }
function cacheLoad() { try { const c = JSON.parse(store.get("jett.cache") || "null"); if (c && c.S) { S = c.S; ST = c.ST; CAT = c.CAT; stAt = c.at || Date.now(); return true; } } catch (e) {} return false; }
const SHORT = { "NFL RedZone": "RedZone", "NFL Network": "NFL Net", "CBS Sports Network": "CBS Sports", "The Weather Channel": "Weather", "FOX Business": "FOX Biz" };

const toastEl = $("#toast"); let toastT = 0;
function toast(msg, err = false) {
  toastEl.textContent = msg; toastEl.classList.toggle("err", err); toastEl.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

/* ------------------------------------------------------------ anywhere (relay)
   Opened from the Pages site (https), the app talks to the box through ntfy.sh instead of the
   home Wi-Fi. Requests and replies are sealed with AES-256-GCM using the key from the setup
   link (#r=<topic>.<key>; the part after # never leaves the phone). Same format as RelayCrypto.kt. */
const RELAY = (() => {
  if (location.protocol !== "https:") return null;   // on home Wi-Fi, straight to the box
  const m = location.hash.match(/r=(jett-[a-z2-9]{24})\.([A-Za-z0-9_-]{43})/);
  if (m) store.set("jett.relay", m[1] + "." + m[2]);
  const v = m ? m[1] + "." + m[2] : store.get("jett.relay");
  return v ? { topic: v.split(".")[0], key: v.split(".")[1] } : {};
})();
const NTFY = "https://ntfy.sh/";
const R = { ready: null, key: null, wait: new Map() };
const b64u = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const pipe = async (u8, t) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(t)).arrayBuffer());
async function rkey() { return R.key ||= await crypto.subtle.importKey("raw", unb64u(RELAY.key), "AES-GCM", false, ["encrypt", "decrypt"]); }
async function seal(str) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await rkey(), await pipe(new TextEncoder().encode(str), new CompressionStream("deflate-raw"))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return "v1." + b64u(out);
}
async function unseal(sealed) {
  const raw = unb64u(sealed.slice(3));
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, await rkey(), raw.slice(12));
  return new TextDecoder().decode(await pipe(new Uint8Array(pt), new DecompressionStream("deflate-raw")));
}
function relayListen() {
  if (R.ready) return R.ready;
  R.ready = new Promise(res => {
    const es = new EventSource(`${NTFY}${RELAY.topic}-r/sse?since=30s`); R.es = es;
    es.onopen = () => res();
    es.onmessage = e => { try { onReply(JSON.parse(e.data).message || ""); } catch (x) {} };
    setTimeout(res, 4000);   // send anyway; replies are kept on the relay briefly
  });
  return R.ready;
}
async function onReply(text) {
  if (!text.startsWith("R.")) return;
  const a = text.split("."); const id = a[1], i = Number(a[2]), n = Number(a[3]), piece = a.slice(4).join(".");
  const w = R.wait.get(id);
  if (!w || !Number.isInteger(i) || !Number.isInteger(n) || n < 1 || n > 64 || i < 0 || i >= n) return;
  if (w.n && w.n !== n) return;   // pieces of one reply all say the same count
  w.n = n; w.parts[i] = piece;
  if (w.parts.filter(x => x !== undefined).length < n) return;
  let rep; try { rep = JSON.parse(await unseal(w.parts.join(""))); } catch (e) { w.parts = []; w.n = 0; return; }   // not genuine: keep waiting
  if (rep.id !== id || !R.wait.has(id)) return;
  R.wait.delete(id); clearTimeout(w.timer); w.res(rep);
}
async function relayApi(path, body, noReply) {
  await relayListen();
  const id = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
  const q = { id, t: Date.now(), m: body === undefined ? "GET" : "POST", p: path, b: body === undefined ? "" : JSON.stringify(body), nr: !!noReply };
  const sealed = await seal(JSON.stringify(q));
  if (sealed.length > 3900) throw new Error("toolong");   // one relay message holds 4,096 bytes
  const reply = new Promise((res, rej) => R.wait.set(id, { res, rej, parts: [], timer: setTimeout(() => { R.wait.delete(id); rej(new Error("asleep")); }, 15000) }));
  reply.catch(() => {});
  let r = null;
  for (let i = 0; i < 2 && !(r && r.ok); i++) {   // one quick retry (a dropped request, or a busy shared address)
    if (i) await new Promise(z => setTimeout(z, 800));
    try { r = await fetch(NTFY + RELAY.topic, { method: "POST", body: sealed, headers: { "X-Firebase": "no" } }); } catch (e) {}
  }
  if (!r || !r.ok || noReply) { const w = R.wait.get(id); if (w) { clearTimeout(w.timer); R.wait.delete(id); } }
  if (!r || !r.ok) throw new Error(r && r.status === 429 ? "limit" : "offline");
  if (noReply) return { ok: true };   // remote key presses: no answer needed (saves relay messages)
  const rep = await reply;
  if (rep.s >= 400) throw new Error(rep.b || "error");
  return JSON.parse(rep.b);
}
/* Photo URLs: from the box at home; from the Pages site's copies when away. */
function photoUrl(id, w) {
  if (RELAY) return `${w <= 240 ? "t" : "m"}/${encodeURIComponent(id)}.jpg`;
  return `/api/photo?id=${encodeURIComponent(id)}&w=${w}&k=${token}`;
}
const relayNote = e => e.message === "asleep" ? "The box didn't answer — it may be asleep" : e.message === "limit" ? "Too many messages today — try again later" : e.message === "offline" ? "No internet connection" : e.message === "toolong" ? "Too big to send from away — do this one at home" : "";

async function api(path, body) {
  if (RELAY) return relayApi(path, body, body?.do === "key");
  const opt = { headers: { "X-Jett-Token": token } };
  if (body !== undefined) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (r.status === 401) { token = ""; store.del("jett.token"); renderPair(); throw new Error("pair"); }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
const act = (o, msg) => api("/api/action", o).then(r => { if (msg) toast(msg); return r; }).catch(e => { if (e.message !== "pair") toast(relayNote(e) || "The TV didn't answer", true); throw e; });

/* Settings: change locally, show it, save it (debounced per section) */
const pending = {}; let saveT = 0;
function setDeep(obj, path, val) { const ks = path.split("."); let o = obj; ks.slice(0, -1).forEach(k => { if (typeof o[k] !== "object" || o[k] === null) o[k] = {}; o = o[k]; }); o[ks[ks.length - 1]] = val; }
function save(path, val, quiet) {
  setDeep(S, path, val); setDeep(pending, path, val);
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    const patch = JSON.parse(JSON.stringify(pending)); for (const k in pending) delete pending[k];
    try { const r = await api("/api/settings", patch); S = r.settings; cacheSave(); if (!quiet) toast("Saved"); refreshState(); }
    catch (e) {
      // Away: the change waits on the relay (12 h) and the box applies it when it wakes.
      if (e.message === "asleep") { cacheSave(); toast("Sent. The box isn't answering — it'll apply this next time it checks in."); }
      else if (e.message !== "pair") { toast(RELAY ? relayNote(e) || "Couldn't save" : "Couldn't save — is the TV on Wi-Fi?", true); if (e.message === "toolong") refreshState(); }
    }
  }, 450);
}
const get = (path, d) => path.split(".").reduce((o, k) => (o && o[k] !== undefined ? o[k] : undefined), S) ?? d;

/* ------------------------------------------------------------ formatting */
const DAYS = ["", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const DSH = ["", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
function fmtTime(t) { if (!t) return ""; const [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; const hh = (h % 12) || 12; return `${hh}:${String(m).padStart(2, "0")} ${ap}`; }
function fmtTimeParts(t) { const s = fmtTime(t); return [s.slice(0, -3), s.slice(-2)]; }
function nyNow() { return ST ? new Date(new Date(ST.time.slice(0, 19)).getTime() + (Date.now() - stAt)) : new Date(); }
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function dow(d) { return ((d.getDay() + 6) % 7) + 1; }  // 1 = Monday
function dateLabel(iso) {
  const today = isoDate(nyNow()), tmw = isoDate(addDays(nyNow(), 1));
  if (iso === today) return "Today"; if (iso === tmw) return "Tomorrow";
  const d = new Date(iso + "T12:00"); return d.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
}
function soundOf(id) { return (CAT?.sounds || []).find(s => s.id === id); }
function contentName(c) {
  if (!c || c === "home") return "Photos";
  if (c.startsWith("youtube:")) { const s = soundOf(c.slice(8)); return s ? s.title : "YouTube video"; }
  return c;
}
function greet() { const h = nyNow().getHours(); return h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; }
const ytThumb = id => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;

/* ------------------------------------------------------------ shell */
const TABS = [["now", "Now", "now"], ["mornings", "Mornings", "sun"], ["bar", "Bar", "bar"], ["backdrops", "Backdrops", "photo"], ["home", "Home", "home"]];
function renderTabs() {
  const n = $("#tabs"); n.hidden = false;
  n.innerHTML = TABS.map(([k, l, i]) => `<button class="${k === tab ? "on" : ""}" data-tab="${k}" aria-label="${l}">${ic(i)}<span>${l}</span></button>`).join("");
  n.onclick = e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.tab; store.set("jett.tab", tab); renderTabs(); render(true); window.scrollTo({ top: 0 }); };
}
function render(animate) {
  const el = $("#app");
  const views = { now: viewNow, mornings: viewMornings, bar: viewBar, backdrops: viewBackdrops, home: viewHome };
  const y = window.scrollY;
  el.innerHTML = ""; const v = (views[tab] || viewNow)(); if (animate) v.classList.add("fade-in"); el.appendChild(v);
  if (!animate) window.scrollTo({ top: y });
}
function setSky() {
  const url = ST?.tvOn && ST?.nowPhoto ? photoUrl(ST.nowPhoto.id, 480) : null;
  if (url) $("#sky").style.backgroundImage = `url("${url}")`;
}
function div(html, cls) { const d = document.createElement("div"); if (cls) d.className = cls; d.innerHTML = html; return d; }
function header(eyebrow, title) {
  const st = UPDATING ? ["wait", "Updating…"] : STALE ? ["lost", "Not answering"] : !ST ? ["lost", "Connecting"] : ST.tvOn ? ["on", ST.photoMode ? "Photo mode" : "TV on"] : ["off", "TV asleep"];
  return `<div class="top"><div><div class="eyebrow">${esc(eyebrow)}</div><h1 class="display">${title}</h1></div><span class="status ${st[0]}"><i class="dot"></i>${st[1]}</span></div>`;
}
function swHtml(id, on, label) { return `<label class="sw"><input type="checkbox" id="${id}" ${on ? "checked" : ""} aria-label="${esc(label || id)}"><span></span></label>`; }

/* ------------------------------------------------------------ NOW */
function viewNow() {
  const tvOn = !!ST?.tvOn;
  const photo = ST?.nowPhoto;
  const sl = ST?.sleepMinutes || 0;
  const chans = favChannels();
  const v = div(`
    ${header(nyNow().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }), `${greet()}, <em>${esc(get("name", "Jett"))}</em>`)}
    ${STALE ? `<div class="card asleepnote mt16"><b>The box isn't answering</b><span>Probably asleep (or the home internet is down). Showing what it last reported${stAt ? ", " + new Date(stAt).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" }) : ""}. Changes still save — the box picks them up the next time it checks in (it tries every 15 minutes).</span><button class="btn mt12" id="recheck">Check again</button></div>` : ""}
    <div class="${STALE ? "stale" : ""}">
    ${tvOn ? `<div class="hero" id="hero" style="background-image:url('${RELAY ? (ST.nowPhoto ? photoUrl(ST.nowPhoto.id, 900) : "") : `/api/now.jpg?t=${encodeURIComponent(ST.nowPhoto?.id || "")}&k=${token}`}')">
        ${photo?.caption ? `<div class="cap">${esc(photo.caption)}</div>` : ""}
        <div class="tag"><span class="pill">${ST.photoMode ? "On the TV now" : ST.onHome ? "Home screen" : "In an app"}</span></div></div>`
      : `<div class="hero asleep"><div class="zz">The TV is asleep</div></div>`}
    <div class="acts">
      <button class="act ${tvOn ? "lit" : ""}" id="pw">${ic("power")}<span>${tvOn ? "Turn off" : "Turn on"}</span></button>
      <button class="act" id="hm">${ic("home")}<span>Home</span></button>
      <button class="act ${ST?.photoMode ? "lit" : ""}" id="ph">${ic("photo")}<span>${ST?.photoMode ? "Exit photos" : "Photos"}</span></button>
      <button class="act ${sl ? "lit" : ""}" id="sl">${ic("moon")}<span>${sl ? sl + " min" : "Sleep"}</span></button>
    </div>
    <h2 class="sec">On the bar <small id="barlabel">${esc(BAR?.label || "")}</small></h2>
    <div id="livebar"></div>
    <h2 class="sec">Volume</h2>
    <div class="card"><div class="vol">
      <button class="round" id="vdn" aria-label="Volume down">${ic("minus", 2)}</button>
      <div class="grow"><input type="range" id="vol" min="0" max="50" value="${tvVolume ?? 10}" aria-label="TV volume"></div>
      <button class="round" id="vup" aria-label="Volume up">${ic("plus", 2)}</button>
      <div class="n num" id="vn">${tvVolume ?? "–"}</div>
    </div>
    <div class="row between mt8"><span class="tiny">${RELAY ? "The TV's own volume, from anywhere" : "The TV's own volume, set over Wi-Fi"}</span><button class="chip ${tvMuted ? "on" : ""}" id="mute">${ic("mute")}<span>${tvMuted ? "Muted" : "Mute"}</span></button></div></div>
    <h2 class="sec">Watch</h2>
    <div class="tiles" id="chans">${chans.map(c => `<button class="tile" data-ch="${esc(c)}"><span><i class="live-dot"></i>Live</span><b>${esc(SHORT[c] || c)}</b></button>`).join("")}
      <button class="tile" id="allch"><span>Guide</span><b>More…</b></button></div>
    <h2 class="sec">Nature <small>plays on YouTube</small></h2>
    <div class="sounds">${(CAT?.sounds || []).map(s => `<button class="sound" data-yt="${esc(s.id)}"><div class="art" style="background-image:url('${ytThumb(s.id)}')"></div><div class="t"><b>${esc(s.title)}</b><span>${esc(s.sub)}</span></div></button>`).join("")}</div>
    <h2 class="sec">Apps</h2>
    <div class="tiles">${orderedApps().filter(a => !(get("home.hiddenApps", [])).includes(a.key)).map(a => `<button class="tile app ${RELAY ? "" : "hasimg"}" data-app="${esc(a.key)}" aria-label="${esc(a.label)}">${RELAY ? "" : `<img class="banner" src="/api/appicon?key=${encodeURIComponent(a.key)}&k=${token}" alt="" onerror="this.parentNode.classList.remove('hasimg');this.remove()">`}<span>App</span><b>${esc(a.label)}</b></button>`).join("")}</div>
    <h2 class="sec">Remote <small>through the TV</small></h2>
    <div class="card">
      <div class="pad">
        <button class="u" data-k="KEY_UP" aria-label="Up">${ic("up", 2)}</button><button class="l" data-k="KEY_LEFT" aria-label="Left">${ic("left", 2)}</button>
        <button class="ok" data-k="KEY_ENTER">OK</button>
        <button class="r" data-k="KEY_RIGHT" aria-label="Right">${ic("right", 2)}</button><button class="d" data-k="KEY_DOWN" aria-label="Down">${ic("down", 2)}</button>
      </div>
      <div class="grid3 mt12"><button class="btn" data-k="KEY_RETURN">${ic("back")}Back</button><button class="btn" id="rhome">${ic("home")}Home</button><button class="btn" data-k="KEY_PLAY">${ic("play")}Play</button></div>
    </div>
    </div>
    <p class="tiny center mt16">${ST ? `Jett Home ${esc(ST.version)}` : ""}</p>`);
  // wiring
  $("#pw", v).onclick = () => tvOn ? act({ do: "off" }, "Turning off").then(later) : act({ do: "on" }, "Turning on").then(later);
  $("#hm", v).onclick = () => act({ do: "home" }, "Home screen").then(later);
  $("#ph", v).onclick = () => act({ do: "photos", on: !ST?.photoMode }, ST?.photoMode ? "Back to the home screen" : "Photo mode").then(later);
  $("#sl", v).onclick = () => sleepSheet();
  const vol = $("#vol", v), vn = $("#vn", v);
  const paint = () => { vol.style.setProperty("--p", (vol.value / vol.max * 100) + "%"); vn.textContent = vol.value; };
  paint();
  vol.oninput = paint;
  vol.onchange = () => setVolume(+vol.value);
  let reread = 0; const step = k => { act({ do: "key", key: k }).then(() => { clearTimeout(reread); reread = setTimeout(readVolume, RELAY ? 2500 : 900); }); };
  $("#vdn", v).onclick = () => { vol.value = Math.max(0, +vol.value - 1); paint(); step("KEY_VOLDOWN"); };

  $("#pl", v).onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; const p = b.dataset.p; let s = new Set(get("backdrop.places", [])); if (!p) s = new Set(); else s.has(p) ? s.delete(p) : s.add(p); save("backdrop.places", [...s]); render(); };
  $("#gf", v).onclick = e => { const b = e.target.closest("[data-g]"); if (!b) return; galFilter = b.dataset.g; store.set("jett.gal", galFilter); galShown = 60; render(); };
  const gal = $("#gal", v), more = $("#more", v);
  const draw = () => {
    gal.innerHTML = list.slice(0, galShown).map(p => `<button class="ph ${hidden.has(p.id) ? "hid" : ""}" data-id="${esc(p.id)}" style="background-image:url('${photoUrl(p.id, 240)}')" aria-label="${esc(p.caption)}">${favs.has(p.id) ? '<span class="hrt">♥</span>' : ""}${hidden.has(p.id) ? '<span class="eye">HIDDEN</span>' : ""}</button>`).join("") || `<div class="card" style="grid-column:1/-1"><span class="muted">${galFilter === "fav" ? "Tap a photo, then ♥ to make it a favourite." : galFilter === "hidden" ? "Nothing hidden." : "No photos."}</span></div>`;
    more.hidden = list.length <= galShown; more.textContent = `Show more (${(list.length - galShown).toLocaleString()} left)`;
  };
  draw();
  more.onclick = () => { galShown += 90; draw(); };
  gal.onclick = e => { const b = e.target.closest("[data-id]"); if (b) photoSheet(all.find(p => p.id === b.dataset.id)); };
  return v;
}
function photoSheet(p) {
  if (!p) return;
  const hidden = new Set(get("backdrop.hidden", [])), favs = new Set(get("backdrop.favorites", []));
  const s = sheet(`<div class="bigph" style="background-image:url('${photoUrl(p.id, 900)}')"></div>
    <h3 style="font-family:var(--italic);font-style:italic;margin-top:14px">${esc(p.caption || "Unknown place")}</h3>
    <p class="sub">${esc(PH.find(x => x[0] === p.phase)?.[1] || "")} photo</p>
    <button class="btn gold block" id="pshow">${ic("now")}Show on the TV now</button>
    <div class="grid2 mt12"><button class="btn" id="pfav">${ic("heart")}${favs.has(p.id) ? "Favourite ✓" : "Favourite"}</button><button class="btn ${hidden.has(p.id) ? "" : "danger"}" id="phide">${ic("eyeoff")}${hidden.has(p.id) ? "Unhide" : "Hide"}</button></div>`);
  $("#pshow", s).onclick = () => act({ do: "showPhoto", id: p.id }, "On the TV").then(() => { closeSheet(); later(); }).catch(() => {});
  $("#pfav", s).onclick = () => { favs.has(p.id) ? favs.delete(p.id) : favs.add(p.id); save("backdrop.favorites", [...favs], true); toast(favs.has(p.id) ? "Added to favourites" : "Removed from favourites"); closeSheet(); render(); };
  $("#phide", s).onclick = () => { hidden.has(p.id) ? hidden.delete(p.id) : hidden.add(p.id); save("backdrop.hidden", [...hidden], true); toast(hidden.has(p.id) ? "Hidden — it won't show again" : "Back in rotation"); closeSheet(); render(); };
}

/* ------------------------------------------------------------ HOME (settings) */
function orderedApps() {
  const apps = (CAT?.apps || []).filter(a => a.installed);
  const order = get("home.appOrder", []);
  return [...apps].sort((a, b) => { const ia = order.indexOf(a.key), ib = order.indexOf(b.key); return (ia < 0 ? 1000 + apps.indexOf(a) : ia) - (ib < 0 ? 1000 + apps.indexOf(b) : ib); });
}
function viewHome() {
  const sorted = orderedApps();
  const hidden = new Set(get("home.hiddenApps", []));
  const v = div(`
    ${header("Home screen", `The <em>details</em>`)}
    <h2 class="sec">On the screen</h2>
    <div class="card">
      <div class="field"><div><span>Weather by the clock</span><div class="tiny">Temperature by the clock, with rain warnings</div></div>${swHtml("wx", get("home.weather", true), "Weather")}</div>
      <div class="field"><span>Sleep tile from</span><select id="sf">${[19, 20, 21, 22, 23].map(h => `<option value="${h}" ${get("home.sleepFrom", 22) == h ? "selected" : ""}>${fmtTime(h + ":00")}</option>`).join("")}</select></div>
    </div>
    <h2 class="sec">Anywhere <small>${RELAY ? "you're using it now" : "off home Wi-Fi"}</small></h2>
    <div class="card list">
      ${RELAY ? `<div class="item"><div class="label"><b>Connected through a relay</b><span>Sealed end to end — the relay (ntfy.sh) only sees scrambled text. If the box isn't answering (usually asleep), changes wait on the relay and apply the next time it checks in (it tries every 15 minutes). Remote taps and the volume only work while the box is awake. The free relay allows about 250 messages a day; normal use is well under that.</span></div></div>`
      : `<div class="item"><div class="label"><b>Use it anywhere</b><span>The same app from the office or on cellular. One-time setup on this Wi-Fi.</span></div><button class="chip on" id="anyw">Set up</button></div>`}
    </div>
    <h2 class="sec">Apps <small>order on the TV</small></h2>
    <div class="card list" id="al">${sorted.map((a, i) => `<div class="item">${RELAY ? "" : `<img src="/api/appicon?key=${encodeURIComponent(a.key)}&k=${token}" alt="" style="width:64px;height:36px;object-fit:cover;border-radius:8px;flex:none;${hidden.has(a.key) ? "opacity:.35" : ""}" onerror="this.style.visibility='hidden'">`}<div class="label"><b style="${hidden.has(a.key) ? "color:var(--ink-3)" : ""}">${esc(a.label)}</b></div>
      <button class="round" data-mv="${i}:-1" aria-label="Move up" ${i === 0 ? "disabled style='opacity:.3'" : ""}>${ic("up", 2)}</button>
      <button class="round" data-mv="${i}:1" aria-label="Move down" ${i === sorted.length - 1 ? "disabled style='opacity:.3'" : ""}>${ic("down", 2)}</button>
      ${swHtml("app_" + a.key, !hidden.has(a.key), "Show " + a.label)}</div>`).join("")}</div>
    <h2 class="sec">This phone</h2>
    <div class="card list">
      <div class="item"><div class="label"><b>Add to your home screen</b><span>In Safari: Share → Add to Home Screen. Opens like an app.</span></div></div>
      <div class="item"><div class="label"><b>Connection</b><span class="num">${RELAY ? "Anywhere (relay)" : esc(location.host) + " · home Wi-Fi"}</span></div></div>
      <div class="item"><div class="label"><b>Version</b><span>${esc(ST?.version || "")}</span></div></div>
      <div class="item"><div class="label"><b>Forget this phone</b><span>${RELAY ? "Clears it here. Delete the home-screen icon too (it holds the key), or use Make a new key at home" : "You'll need a new code from the TV"}</span></div><button class="chip" id="unpair">Forget</button></div>
    </div>`);
  $("#wx", v).onchange = e => save("home.weather", e.target.checked);
  $("#sf", v).onchange = e => save("home.sleepFrom", +e.target.value);
  v.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => { const [i, d] = b.dataset.mv.split(":").map(Number); const keys = sorted.map(a => a.key); const j = i + d; if (j < 0 || j >= keys.length) return; [keys[i], keys[j]] = [keys[j], keys[i]]; save("home.appOrder", keys); render(); });
  sorted.forEach(a => $("#app_" + a.key, v).onchange = e => { const h = new Set(get("home.hiddenApps", [])); e.target.checked ? h.delete(a.key) : h.add(a.key); save("home.hiddenApps", [...h]); render(); });
  $("#unpair", v).onclick = async () => {
    if (RELAY) { store.del("jett.relay"); store.del("jett.cache"); location.replace(location.pathname); return; }
    try { await api("/api/unpair", {}); } catch (e) {} token = ""; store.del("jett.token"); renderPair();
  };
  if ($("#anyw", v)) $("#anyw", v).onclick = () => anywhereSheet();
  return v;
}

function anywhereSheet(link) {
  if (!link) { api("/api/remote").then(r => anywhereSheet(r.link)).catch(() => toast("The box didn't answer", true)); return; }
  const s = sheet(`<h3>Use it <em>anywhere</em></h3>
    <p class="sub">Opens the same app on a private page that reaches the box through a relay, from anywhere. Everything is sealed with a key that's only on the box and your phone.</p>
    <div class="card list">
      <div class="item"><div class="label"><b>1. Open the link</b><span>It opens in Safari (if it opens inside this app, tap the Safari icon)</span></div></div>
      <div class="item"><div class="label"><b>2. Share → Add to Home Screen</b><span>From that page. Use the new icon when you're out; keep this one for home (it's faster, and the remote is instant).</span></div></div>
    </div>
    <a class="btn gold block mt16" id="ago" href="${esc(link)}" target="_blank" rel="noopener">Open the anywhere app</a>
    <button class="btn block mt12" id="acp">Copy link</button>
    <p class="tiny mt16">The link is the key: don't share it (it also stays in Safari's history). Lost a phone? Make a new key — old links stop working.</p>
    <button class="btn block danger mt12" id="arst">Make a new key</button>`);
  $("#acp", s).onclick = async () => { try { await navigator.clipboard.writeText(link); toast("Copied — paste it in Safari"); } catch (e) { prompt("Copy this link", link); } };
  $("#arst", s).onclick = e => {
    const b = e.currentTarget;
    if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Tap again — the anywhere icon will stop working"; setTimeout(() => { delete b.dataset.sure; b.textContent = "Make a new key"; }, 5000); return; }
    api("/api/remote", { reset: true }).then(r => { toast("New key made. Old links stop working."); anywhereSheet(r.link); }).catch(() => toast("The box didn't answer", true));
  };
}

/* ------------------------------------------------------------ sheets */
let scrimEl = null, sheetEl = null;
function sheet(html) {
  closeSheet(true);
  scrimEl = document.createElement("div"); scrimEl.className = "scrim"; scrimEl.onclick = () => closeSheet();
  sheetEl = document.createElement("div"); sheetEl.className = "sheet"; sheetEl.setAttribute("role", "dialog");
  sheetEl.innerHTML = `<div class="grab"></div><button class="xbtn" aria-label="Close">✕</button>${html}`;
  sheetEl.querySelector(".xbtn").onclick = () => closeSheet();
  document.body.append(scrimEl, sheetEl);
  requestAnimationFrame(() => { scrimEl.classList.add("show"); sheetEl.classList.add("show"); });
  // swipe down to close
  let y0 = null;
  sheetEl.addEventListener("touchstart", e => { y0 = sheetEl.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  sheetEl.addEventListener("touchmove", e => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; if (dy > 0) sheetEl.style.transform = `translateY(${dy}px)`; }, { passive: true });
  sheetEl.addEventListener("touchend", e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; sheetEl.style.transform = ""; if (dy > 110) closeSheet(); y0 = null; });
  return sheetEl;
}
function closeSheet(now) {
  document.querySelectorAll(".sheet[style*='z-index: 13']").forEach(x => x.remove());
  const s = sheetEl, c = scrimEl; sheetEl = scrimEl = null;
  if (!s) return;
  if (now) { s.remove(); c.remove(); return; }
  s.classList.remove("show"); c.classList.remove("show");
  setTimeout(() => { s.remove(); c.remove(); }, 320);
}

/* ------------------------------------------------------------ pairing */
function renderPair(msg) {
  $("#tabs").hidden = true;
  const el = $("#app");
  el.innerHTML = `<div class="pair fade-in">
    <div class="eyebrow">Bedroom TV</div>
    <div class="mark">Jett <em>Home</em></div>
    <p class="muted" style="max-width:30ch">Control your TV from this phone: mornings, the sports bar, backdrops and the remote.</p>
    <div id="step1"><button class="btn gold block mt16" id="showcode">Show a code on the TV</button>
      <p class="tiny mt12">Make sure your phone is on your home Wi-Fi.</p></div>
    <div id="step2" hidden>
      <p class="mt16">Type the 4 digits shown on the TV.</p>
      <div class="code">${[0, 1, 2, 3].map(i => `<input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit ${i + 1}" data-i="${i}">`).join("")}</div>
      <button class="btn ghost block" id="again">Show a new code</button>
    </div>
    ${msg ? `<p class="tiny mt12" style="color:#ffb4ad">${esc(msg)}</p>` : ""}
  </div>`;
  const start = async () => {
    try { const r = await fetch("/api/pair/start", { method: "POST" }).then(r => r.json());
      if (r.error === "tvoff") { toast("Turn the TV on first — the code shows on screen", true); return; }
      if (r.error === "wait") { toast("Give it 30 seconds, then ask for a new code", true); return; }
      if (r.error === "locked") { toast("Too many wrong codes. Try again in 10 minutes.", true); return; }
      $("#step1").hidden = true; $("#step2").hidden = false; $(".code input").focus(); }
    catch (e) { toast("Can't reach the TV box. Same Wi-Fi?", true); }
  };
  $("#showcode").onclick = start; $("#again").onclick = start;
  const ins = [...el.querySelectorAll(".code input")];
  ins.forEach((inp, i) => {
    inp.oninput = () => { inp.value = inp.value.replace(/\D/g, "").slice(-1); if (inp.value && i < 3) ins[i + 1].focus(); if (ins.every(x => x.value)) submit(); };
    inp.onkeydown = e => { if (e.key === "Backspace" && !inp.value && i > 0) ins[i - 1].focus(); };
  });
  const submit = async () => {
    const code = ins.map(x => x.value).join("");
    try {
      const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
      const j = await r.json();
      if (j.token) { token = j.token; store.set("jett.token", token); toast("Paired"); boot(); }
      else { toast(j.error === "expired" ? "That code expired — get a new one" : j.error === "locked" ? "Too many wrong codes. Try again in 10 minutes." : "Wrong code, try again", true); ins.forEach(x => x.value = ""); ins[0].focus(); }
    } catch (e) { toast("Can't reach the TV box", true); }
  };
}

/* ------------------------------------------------------------ data */
let lastSig = "";
const linked = () => RELAY ? !!RELAY.key : !!token;
async function refreshState() {
  try {
    const r = await api("/api/state");
    // Redraw only when something changed (not every 15 s), so nothing flickers or loses its place.
    const sig = JSON.stringify([r.settings, { ...r.status, time: 0 }]);
    const first = !ST, wasStale = STALE; S = r.settings; ST = r.status; stAt = Date.now(); STALE = false; setSky(); cacheSave();
    if (sig === lastSig && !first && !wasStale) return;
    // Mark it seen only once it's on screen (a change made while a sheet is open shows after).
    if (first || !sheetEl) { if (!document.activeElement || !document.activeElement.matches("input[type=range],input[type=text],select")) { render(); lastSig = sig; } }
  } catch (e) {
    if (e.message === "pair") return;
    if (RELAY && S) { if (!STALE) { STALE = true; if (!sheetEl) render(); } return; }   // keep showing the last state
    ST = null; const st = document.querySelector(".status"); if (st) { st.className = "status lost"; st.innerHTML = '<i class="dot"></i>Offline'; }
  }
}
async function boot() {
  if (RELAY && !RELAY.key) { renderRelaySetup(); return; }
  if (!RELAY && !token) { renderPair(); return; }
  // Away: open at once on the last state seen, then catch up.
  const cached = RELAY && cacheLoad();
  if (cached) { UPDATING = true; renderTabs(); render(true); }
  try {
    const [st, cat, photos] = await Promise.all([
      api("/api/state"), api(RELAY ? "/api/catalog?lite=1" : "/api/catalog"),
      RELAY ? fetch("photos.json").then(r => r.json()).catch(() => []) : null]);
    S = st.settings; ST = st.status; stAt = Date.now(); STALE = false; UPDATING = false; CAT = cat; if (photos) CAT.photos = photos; setSky(); cacheSave();
    lastSig = JSON.stringify([S, { ...ST, time: 0 }]);
    renderTabs(); render(!cached);
  } catch (e) {
    if (e.message === "pair") return;
    if (cached) {   // the box may be asleep: stay on the saved state; photos still come from the site
      UPDATING = false; STALE = true; if (!sheetEl) render();
      if (CAT && !(CAT.photos || []).length) fetch("photos.json").then(r => r.json()).then(p => { CAT.photos = p; if (tab === "backdrops" && !sheetEl) render(); }).catch(() => {});
      if (e.message !== "asleep") toast(relayNote(e) || "The box didn't answer", true);
      return;
    }
    const why = RELAY ? (relayNote(e) || "The box didn't answer.") + " It may be asleep — try again in a few minutes." : "Can't reach the TV box right now. Make sure your phone is on your home Wi-Fi.";
    $("#app").innerHTML = `<div class="pair"><div class="mark">Jett <em>Home</em></div><p class="muted">${esc(why)}</p><button class="btn gold block mt16" onclick="boot()">Try again</button></div>`;
  }
}
function renderRelaySetup() {
  $("#tabs").hidden = true;
  $("#app").innerHTML = `<div class="pair fade-in"><div class="mark">Jett <em>Home</em></div>
    <p class="muted">To use this away from home, set it up once on your home Wi-Fi:</p>
    <div class="card list mt16" style="text-align:left">
      <div class="item"><div class="label"><b>1. Open the home app</b><span>http://192.168.1.250:8765 on your home Wi-Fi</span></div></div>
      <div class="item"><div class="label"><b>2. Home tab → Use it anywhere</b><span>It opens this page with your private key</span></div></div>
      <div class="item"><div class="label"><b>3. Share → Add to Home Screen</b><span>From that page, so the key comes with it</span></div></div>
    </div></div>`;
}
// Home: every 15 s. Away: every 3 minutes (each check is two relay messages; ntfy.sh allows the box
// 250 a day). Away, changes you make refresh right after anyway.
setInterval(() => { if (document.visibilityState === "visible" && linked() && S) refreshState(); }, RELAY ? 180000 : 15000);
document.addEventListener("visibilitychange", () => {
  // iOS drops the relay listener in the background: start a fresh one on return.
  // (A dead connection can still say "open" on iOS, so after 20 s away always start fresh.)
  if (RELAY && document.visibilityState === "hidden") R.hiddenAt = Date.now();
  if (RELAY && document.visibilityState === "visible" && R.es && (R.es.readyState !== 1 || Date.now() - (R.hiddenAt || 0) > 20000)) { try { R.es.close(); } catch (e) {} R.ready = null; }
  if (document.visibilityState === "visible" && linked() && S) { refreshState(); if (tab === "now" && !RELAY) readVolume(); } });
boot();
</script>
